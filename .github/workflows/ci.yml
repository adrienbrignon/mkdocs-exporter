name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_MKDOCS_2_WARNING: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group dev
      - name: Run Ruff linter
        run: uv run --no-sync ruff check --output-format github
      - name: Run Ruff formatter
        run: uv run --no-sync ruff format --check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group dev
      - name: Run mypy
        run: uv run --no-sync mypy

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group dev
      - name: Get Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(uv run --no-sync python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        run: uv run --no-sync playwright install --with-deps --only-shell chromium
      - name: Run tests
        run: uv run --no-sync pytest

  properdocs:
    name: Test (ProperDocs)
    runs-on: ubuntu-latest
    env:
      MKDOCS_EXPORTER_TEST_PROPERDOCS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --no-default-groups --group dev
          uv pip install properdocs properdocs-theme-mkdocs properdocs-theme-readthedocs
      - name: Install browser
        run: uv run --no-sync playwright install --with-deps --only-shell chromium
      - name: Run tests
        run: uv run --no-sync pytest

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Check bundled resources
        run: |
          python3 - <<'PY'
          import glob, zipfile

          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          required = ("pagedjs.min.js", "pdf.js", "material.css", "readthedocs.css")
          missing = [r for r in required if not any(n.endswith(r) for n in names)]
          assert not missing, f"missing from wheel: {missing}"
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
