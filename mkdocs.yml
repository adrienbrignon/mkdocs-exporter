site_name: MkDocs Exporter
site_url: https://adrienbrignon.github.io/mkdocs-exporter
repo_url: https://github.com/adrienbrignon/mkdocs-exporter
repo_name: adrienbrignon/mkdocs-exporter
edit_uri: edit/master/docs/
site_dir: site

validation:
  absolute_links: ignore
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/file-document-arrow-right
    repo: fontawesome/brands/github
  palette:
    primary: custom
    accent: custom
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.prune
    - toc.follow

extra:
  social:
    - name: GitHub
      icon: fontawesome/brands/github
      link: https://github.com/adrienbrignon/mkdocs-exporter
    - name: PyPI
      icon: fontawesome/brands/python
      link: https://pypi.org/project/mkdocs-exporter

plugins:
  - privacy:
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://installer.readthedocs.io/en/stable/objects.inv
          options:
            show_bases: false
            show_source: false
            show_labels: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
  - search:
      lang: en
  - awesome-pages
  - macros:
      include_dir: .
      modules:
        - macros
  - git-revision-date-localized:
      enable_creation_date: false
  - redirects:
      redirect_maps:
        'index.md': 'getting-started.md'
        'migration/v7.md': 'guides/migrating-to-v7.md'
        'configuration/combining-pages.md': 'configuration/books.md'
        'samples/diagrams.md': 'examples/content/diagrams.md'
        'samples/mathematics.md': 'examples/content/mathematics.md'
        'samples/multimedia.md': 'examples/content/multimedia.md'
  - minify:
      minify_html: true
  - social:
      cards_layout_options:
        background_color: '#EA2027'
  - git-committers:
      repository: adrienbrignon/mkdocs-exporter
      branch: master
  - exporter:
      logging:
        level: debug
      formats:
        pdf:
          enabled: !ENV [MKDOCS_EXPORTER_PDF, true]
          concurrency: 16
          stylesheets:
            - resources/stylesheets/pdf.css
          covers:
            front: resources/templates/covers/front.html.j2
            back: resources/templates/covers/back.html.j2
          header:
            center: "{site_name} — {page_title}"
          footer:
            center: "Page {page} of {pages}"
          browser:
            debug: false
          books:
            - enabled: !ENV [MKDOCS_EXPORTER_BOOKS, true]
              output: documentation.pdf
              covers: front
              toc:
                enabled: true
      buttons:
        - title: View as PDF
          icon: material-file-move-outline
          enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.enabled
          attributes:
            target: _blank
            href: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.href
        - title: Download as PDF
          icon: material-file-download-outline
          enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.enabled
          attributes: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.attributes
        - title: Download the documentation
          icon: material-book-arrow-down-outline
          enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.book.enabled
          attributes: !!python/name:mkdocs_exporter.formats.pdf.buttons.book.attributes

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - mdx_truly_sane_lists:
      truly_sane: true
      nested_indent: 2
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/stylesheets/custom.css
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.1/katex.min.css

extra_javascript:
  - assets/scripts/katex.js
  - assets/scripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.1/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.1/contrib/auto-render.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/4.1.3/tex-mml-chtml.min.js
