site_name: Field Guide
site_description: An example of documents generated by MkDocs Exporter.
site_author: MkDocs Exporter
docs_dir: ../content

theme:
  name: material
  font: false
  palette:
    primary: custom
    accent: custom

extra_css:
  - assets/field-guide.css

nav:
  - index.md
  - Guide:
      - guide/writing.md
      - guide/printing.md
  - Reference:
      - reference/paper-sizes.md
      - reference/glossary.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
