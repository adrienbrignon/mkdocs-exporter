# The project the example documents of `examples/` are generated from (`make examples`).
site_name: Field Guide
site_description: An example of documents generated by MkDocs Exporter, from a small website.
site_author: MkDocs Exporter

theme:
  name: material
  font: false
  palette:
    primary: indigo

nav:
  - index.md
  - Guide:
      - guide/writing.md
      - guide/printing.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - exporter:
      formats:
        pdf:
          stylesheets:
            - pdf.css
          covers:
            front: covers/front.html.j2
            back: covers/back.html.j2
          header:
            left: "{site_name}"
            right: "{section}"
          footer:
            center: "Page {page} of {pages}"
          toc:
            enabled: true
            depth: 3
          cache:
            enabled: false
          aggregator:
            enabled: true
            output: example.pdf
            covers: limits
            toc:
              enabled: true
